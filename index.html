<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마음 진료소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* VOICE: 정갈한 동네 진료소, 따뜻한 종이 위에서
   IDEA: 크라프트지 위에 붙인 진료 카드와 처방전
   PICTURE: 매 화면의 조작 요소 하나, 마지막엔 도장이 찍힌 처방전
   COLOUR and TYPE: 크라프트 바탕, 아이보리 종이, 세이지·살구 테이프, 테라코타 포인트 / IBM Plex Sans KR, 마지막 한마디만 손글씨
   LAYOUT: 폰 한 열, 상단 진행 점, 하단 고정 공감 하트 */
:root{color-scheme:light;--kraft:#E9DCC6;--paper:#FFFDF7;--ink:#3F3226;--mute:#94816C;--line:#E8DDCD;--soft:#F5EDE1;--acc:#C9694A;--accbg:#FBE7DE;--sage:#BFD6AE;--peach:#F2B8A2;--top:#3F3226}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--kraft:#2B241C;--top:#FFFDF7}}
:root[data-theme=dark]{--kraft:#2B241C;--top:#FFFDF7}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--kraft);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:100px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{max-width:480px;margin:0 auto;padding:14px 20px 8px;display:flex;justify-content:space-between;align-items:center;color:var(--top)}
.brand{font-weight:600;font-size:15px;display:flex;gap:7px;align-items:center}
.dots{display:flex;gap:6px}.dots i{width:22px;height:5px;border-radius:3px;background:currentColor;opacity:.22}.dots i.on{background:var(--acc);opacity:1}
main{max-width:480px;margin:0 auto;padding:14px 18px 0}
.card{position:relative;background:var(--paper);border-radius:16px;padding:30px 22px 22px;min-height:500px;display:flex;flex-direction:column}
.tape{position:absolute;top:-9px;width:78px;height:20px;opacity:.85}
.tape.l{left:26px;background:var(--sage);transform:rotate(-4deg)}.tape.r{right:26px;background:var(--peach);transform:rotate(3deg)}
.tag{font-size:13px;color:var(--acc);font-weight:600;margin:0 0 6px}
h1{font-size:clamp(32px,9vw,40px);line-height:1.15;margin:4px 0 12px;text-wrap:balance}
h2{font-size:22px;line-height:1.4;margin:0 0 20px;text-wrap:balance}
p{margin:0 0 12px}.sub{color:var(--mute);font-size:14px}
.spacer{flex:1;min-height:16px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px}
.btn:disabled{background:var(--line);color:var(--mute);cursor:default}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 18px;margin-bottom:8px;border:1px solid var(--line);border-radius:14px;background:transparent;font-size:16px;text-align:left;transition:opacity .2s}
.opt.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}.opt.dim{opacity:.45}
.blanket{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:240px;border-radius:20px;border:0;background:var(--soft);color:var(--acc);touch-action:manipulation;user-select:none;transition:transform .06s}
.blanket:active{transform:scale(.97)}
.big{font-size:clamp(44px,13vw,58px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 16px}.timer b{display:block;height:100%;width:100%;background:var(--acc)}
canvas.pad{display:block;width:100%;aspect-ratio:1;border-radius:14px;touch-action:none;background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
.ghost{min-height:54px;border:1px solid var(--line);background:transparent;border-radius:14px}
input[type=range]{width:100%;accent-color:var(--acc);height:44px}
.who{font-size:14px;color:var(--mute);margin:0 0 4px}
.bubble{align-self:flex-start;background:var(--soft);padding:14px 20px;border-radius:4px 18px 18px 18px;font-size:22px;margin:0 0 18px}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.faces button{min-height:84px;border:1px solid var(--line);border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px}
.stones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.stone{padding:14px 16px;min-height:58px;max-width:47%;border:1px solid var(--line);background:var(--soft);font-size:14px;line-height:1.35;transition:transform .2s}
.stone.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600;transform:rotate(-3deg)}
.wx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wx button{min-height:110px;border:1px solid var(--line);border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:15px;padding:8px}
.wx button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.stamp{width:110px;height:110px;border:3px solid var(--acc);color:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:16px;line-height:1.3;transform:rotate(-12deg)}
.pop{animation:pop .4s ease-out}@keyframes pop{0%{transform:rotate(-12deg) scale(1.8);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.rx .head{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:14px}
.rx .stamp{position:absolute;right:18px;top:78px;width:86px;height:86px;font-size:13px}
.emp{font-family:"Nanum Pen Script";font-size:clamp(27px,7.6vw,31px);line-height:1.45;margin:8px 0 18px;background-image:linear-gradient(transparent calc(100% - 1px),var(--line) 1px);background-size:100% 1.45em;text-wrap:pretty}
.drug{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px}.drug b{display:block;color:var(--acc);font-size:13px}
.foot{font-size:13px;color:var(--mute);border-top:1px dashed var(--line);padding-top:12px;margin:18px 0 0}
.heartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#heart{display:flex;align-items:center;gap:8px;min-height:54px;padding:0 28px;border-radius:999px;border:0;background:var(--paper);color:var(--acc);font-weight:600;box-shadow:0 2px 0 rgba(63,50,38,.12)}
#heart:active{transform:scale(.94)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.fh{position:absolute;bottom:74px;color:var(--acc);animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-60vh) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:8px 14px;border-radius:999px;z-index:8;white-space:nowrap;transition:opacity .4s}
@media(prefers-reduced-motion:reduce){.fh,.pop{animation:none}.fh{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="#C9694A"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>마음 진료소</div><div class="dots" id="dots" aria-label="진행 상황"></div></header>
<main id="app"></main>
<div class="heartbar"><button id="heart" aria-label="공감하기"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.5 6.6 4.5c2.1 0 3.4 1.2 4.4 2.6 1-1.4 2.3-2.6 4.4-2.6 3.6 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z" fill="currentColor"/></svg>공감 <span id="hc">0</span></button></div>
<div class="fx" id="fx"></div>
<script>
{
const $=s=>document.querySelector(s);
const app=$('#app');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const newNick=()=>pick(['졸린','수줍은','용감한','느긋한','엉뚱한','다정한','배고픈'])+' '+pick(['수달','고양이','판다','펭귄','다람쥐','거북이','부엉이','햄스터'])+' #'+(10+Math.floor(Math.random()*80));
let S;
const reset=()=>{S={nick:newNick(),lock:-1,lockSec:0,lockChg:0,kicks:0,redraw:0,pts:[],fPts:[],fReal:0,sReal:0,fGiven:60,sGiven:60,judge:[],stones:[],wx:-1}};
reset();
let timers=[];const later=(f,ms)=>timers.push(setTimeout(f,ms));const every=(f,ms)=>timers.push(setInterval(f,ms));
const clearT=()=>{timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]};

const LOCK=['성적','연애 이야기','가족 이야기','진짜 꿈','콤플렉스'];
const LOCKO=['성적을','연애 이야기를','가족 이야기를','진짜 꿈을','콤플렉스를'];
const MSGS=[['조장','네.'],['친구','ㅇㅇ'],['교수님','잠깐 통화 가능한가요?'],['동기','ㅋ'],['조장','나중에 얘기해']];
const STONES=[['결국 혼자 남을 것 같아',0],['나는 왜 이것밖에 안 될까',1],['연락이 끊기면 어쩌지',0],['또 망쳤어',1],['다들 나 없이도 잘 지내는 것 같아',0],['다른 애들은 다 잘하는데',1]];
const WX=['안 올 거야','우산 챙겨 나간다','그냥 안 나간다','비 맞는 것도 좋지'];

const lockSvg=c=>`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="${c?'M8 11V8a4 4 0 0 1 8 0v3':'M8 11V8a4 4 0 0 1 7.6-1.7'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const faceSvg=k=>{const m=['M8 14.5c1.2 1.6 2.4 2.2 4 2.2s2.8-.6 4-2.2','M8.5 15.5h7','M8 16.5c1.2-1.5 2.4-2 4-2s2.8.5 4 2'][k];const b=k===2?'<path d="M7.5 8.5l2.5 1.2M16.5 8.5L14 9.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>':'';return `<svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="11" r="1.2" fill="currentColor"/><circle cx="15" cy="11" r="1.2" fill="currentColor"/>${b}<path d="${m}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`};
const wxIcon=[
'<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 4v5M20 31v5M4 20h5M31 20h5M8.7 8.7l3.5 3.5M27.8 27.8l3.5 3.5M8.7 31.3l3.5-3.5M27.8 12.2l3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
'<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20a15 13 0 0 1 30 0z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M20 20v11a3 3 0 0 1-6 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
'<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 19L20 7l14 12M10 16v16h20V16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>',
'<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M11 23a6 6 0 0 1 1-12 8 8 0 0 1 15 2 5 5 0 0 1 1 10z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 28l-2 5M21 28l-2 5M28 28l-2 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'];

const card=(inner,cls='')=>`<section class="card ${cls}"><span class="tape l"></span><span class="tape r"></span>${inner}</section>`;
const head=(n,t)=>`<p class="tag">${n}부 진료 · ${t}</p>`;
const btn=(label,dis)=>`<button class="btn" id="nx"${dis?' disabled':''}>${label}</button>`;
const onNext=f=>{$('#nx').onclick=f};

function roundness(p){if(p.length<8)return 0;let cx=0,cy=0;p.forEach(q=>{cx+=q[0];cy+=q[1]});cx/=p.length;cy/=p.length;const d=p.map(q=>Math.hypot(q[0]-cx,q[1]-cy));const m=d.reduce((a,b)=>a+b,0)/d.length;if(m<5)return 0;const sd=Math.sqrt(d.reduce((a,b)=>a+(b-m)**2,0)/d.length);const gap=Math.hypot(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1])/m;return Math.round(clamp(100-sd/m*350-Math.max(0,gap-.15)*40,0,100))}
function friendCircle(){const pts=[],ph=Math.random()*6,n=90;for(let i=0;i<n;i++){const t=-1.4+i/n*Math.PI*2*.93;const r=80*(1+.08*Math.sin(3*t+ph)+.04*(Math.random()-.5));pts.push([100+r*Math.cos(t),100+r*Math.sin(t)])}return pts}
function drawing(p){if(!p.length)return '';let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.forEach(q=>{x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});const s=160/Math.max(x1-x0,y1-y0,1),ox=(200-(x1-x0)*s)/2,oy=(200-(y1-y0)*s)/2;const d=p.map((q,i)=>(i?'L':'M')+((q[0]-x0)*s+ox).toFixed(1)+' '+((q[1]-y0)*s+oy).toFixed(1)).join('');return `<svg viewBox="0 0 200 200" style="width:58%;display:block;margin:0 auto 6px" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

function done(n,to){app.innerHTML=card(`<div class="spacer"></div><div class="stamp pop" style="margin:0 auto">${n}부<br>진료 완료</div><h2 style="text-align:center;margin:26px 0 6px">이제 앞 화면을 봐 주세요</h2><p class="sub" style="text-align:center;margin:0">다음 진료가 시작되면 자동으로 넘어가요</p><div class="spacer"></div><p class="sub" style="text-align:center;font-size:12px">체험판에서는 아래 버튼으로 넘겨요</p>${btn(n<5?`${n+1}부로`:'처방전 받기')}`);onNext(()=>go(to))}

const steps=[
{p:0,r(){app.innerHTML=card(`<p class="tag">명저읽기 · 나도 아직 나를 모른다</p><h1>마음 진료소</h1><p>발표를 들으며 다섯 번 짧게 진료를 받고, 마지막에 나만의 처방전을 받아 가요.</p><div class="spacer"></div><p class="sub" style="margin:0">접수번호</p><p style="font-size:22px;font-weight:600;color:var(--acc);margin:0 0 20px">${S.nick}</p>${btn('접수하기')}<p class="sub" style="text-align:center;margin:14px 0 0;font-size:13px">아래 하트는 발표 중 공감될 때마다 눌러 주세요</p>`);onNext(()=>go(1))}},

{p:1,r(){const t0=Date.now();app.innerHTML=card(`${head(1,'타인의 시선')}<h2>이 중 딱 하나만<br>'나만 보기'로 잠근다면?</h2><div id="L"></div><div class="spacer"></div>${btn('다 골랐어요',true)}`);
const d=()=>{$('#L').innerHTML=LOCK.map((t,i)=>`<button class="opt ${S.lock===i?'on':S.lock>=0?'dim':''}" data-i="${i}"><span>${t}</span>${lockSvg(S.lock===i)}</button>`).join('');$('#L').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.lock<0)S.lockSec=Math.max(1,Math.round((Date.now()-t0)/1000));else if(S.lock!==i)S.lockChg++;S.lock=i;d();$('#nx').disabled=false})};d();onNext(()=>done(1,2))}},

{p:2,r(){let st='ready';app.innerHTML=card(`${head(2,'이불킥')}<h2>민망했던 순간만큼<br>10초 동안 이불을 차세요!</h2><div class="timer"><b id="tb"></b></div><button class="blanket" id="bk"><svg viewBox="0 0 140 44" width="120" aria-hidden="true"><path d="M4 26Q20 8 36 26T68 26T100 26T136 26" fill="none" stroke="currentColor" stroke-width="3"/><path d="M4 38Q20 20 36 38T68 38T100 38T136 38" fill="none" stroke="currentColor" stroke-width="3"/></svg><span class="big" id="kc">시작</span><span id="kl" style="font-size:14px">탭하면 시작돼요</span></button><div class="spacer"></div>${btn('다 찼어요',true)}`);
$('#bk').onclick=()=>{if(st==='ready'){st='run';S.kicks=0;$('#kc').textContent='0';$('#kl').textContent='연타!';$('#nx').disabled=true;const t0=Date.now();every(()=>{const e=(Date.now()-t0)/1000;$('#tb').style.width=Math.max(0,100-e*10)+'%';if(e>=10){clearT();st='ready';$('#kl').textContent='끝! 다시 하려면 탭';$('#nx').disabled=false}},50);return}if(st==='run'){S.kicks++;$('#kc').textContent=S.kicks}};onNext(()=>{clearT();done(2,3)})}},

{p:3,r(){app.innerHTML=card(`${head(3,'완벽주의')}<h2>손가락으로 완벽한 원을<br>그려 보세요</h2><canvas class="pad" id="cv"></canvas><div class="row"><button class="ghost" id="rd">다시 그리기</button><button class="btn" id="ok">이걸로 제출</button></div>`);
const cv=$('#cv'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,W=cv.clientWidth;cv.width=W*dpr;cv.height=W*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#3F3226';
let dr=false;S.pts=[];S.redraw=0;
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const wipe=()=>{if(S.pts.length)S.redraw++;ctx.clearRect(0,0,W,W);S.pts=[]};
cv.onpointerdown=e=>{wipe();dr=true;cv.setPointerCapture(e.pointerId);const p=pos(e);S.pts.push(p);ctx.beginPath();ctx.moveTo(...p)};
cv.onpointermove=e=>{if(!dr)return;const p=pos(e);S.pts.push(p);ctx.lineTo(...p);ctx.stroke()};
cv.onpointerup=cv.onpointercancel=()=>{dr=false};
$('#rd').onclick=wipe;
$('#ok').onclick=()=>{if(S.pts.length<15)return;S.sReal=roundness(S.pts);S.fPts=friendCircle();S.fReal=roundness(S.fPts);go(4)}}},

{p:3,r(){app.innerHTML=card(`${head(3,'완벽주의')}<h2>친구가 그린 원이에요.<br>몇 점 줄래요?</h2>${drawing(S.fPts)}<div class="big" style="text-align:center;color:var(--acc)" id="v">${S.fGiven}</div><input type="range" min="0" max="100" step="1" value="${S.fGiven}" id="r" aria-label="친구 원 점수"><div class="spacer"></div>${btn('채점 완료')}`);
$('#r').oninput=e=>{S.fGiven=+e.target.value;$('#v').textContent=S.fGiven};onNext(()=>go(5))}},

{p:3,r(){app.innerHTML=card(`${head(3,'완벽주의')}<h2>이번엔 내가 그린 원이에요.<br>몇 점 줄래요?</h2>${drawing(S.pts)}<div class="big" style="text-align:center;color:var(--acc)" id="v">${S.sGiven}</div><input type="range" min="0" max="100" step="1" value="${S.sGiven}" id="r" aria-label="내 원 점수"><div class="spacer"></div>${btn('채점 완료')}`);
$('#r').oninput=e=>{S.sGiven=+e.target.value;$('#v').textContent=S.sGiven};onNext(()=>done(3,6))}},

{p:4,r(){let i=0;S.judge=[];app.innerHTML=card(`${head(4,'퍼즐 놀이')}<h2 id="q">짧은 답장이 하나씩 와요.<br>1초 안에 느낌대로 골라 주세요!</h2><div id="g" style="display:flex;flex-direction:column;flex:1"><div class="spacer"></div><button class="btn" id="go">시작</button></div>`);
const run=()=>{if(i>=MSGS.length){clearT();go(7);return}const [who,m]=MSGS[i];$('#q').textContent=`답장 ${i+1} / 5`;$('#g').innerHTML=`<p class="who">${who}</p><div class="bubble">${m}</div><div class="spacer"></div><div class="timer"><b id="tb" style="transition:width 1.6s linear"></b></div><div class="faces">${['좋은 뜻','그냥','화났다'].map((t,k)=>`<button data-k="${k}">${faceSvg(k)}${t}</button>`).join('')}</div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>{const tb=$('#tb');if(tb)tb.style.width='0%'}));
const fin=k=>{clearT();S.judge.push(k);i++;run()};$('#g').querySelectorAll('.faces button').forEach(b=>b.onclick=()=>fin(+b.dataset.k));later(()=>fin(null),1600)};
$('#go').onclick=run}},

{p:4,r(){S.stones=[];const order=[0,1,2,3,4,5].sort(()=>Math.random()-.5);const sh=['46% 54% 52% 48% / 58% 44% 56% 42%','58% 42% 45% 55% / 48% 60% 40% 52%','40% 60% 55% 45% / 52% 46% 54% 48%','52% 48% 60% 40% / 44% 56% 46% 54%','48% 52% 42% 58% / 60% 42% 58% 40%','55% 45% 50% 50% / 46% 58% 42% 54%'];
app.innerHTML=card(`${head(4,'당신의 우울은 어떤 종류인가요')}<h2>유난히 지친 날, 가장 무거운<br>돌 두 개를 골라 주세요</h2><div class="stones" id="P">${order.map((k,j)=>`<button class="stone" data-k="${k}" style="border-radius:${sh[j]}">${STONES[k][0]}</button>`).join('')}</div><div class="spacer"></div>${btn('두 개 골랐어요',true)}`);
$('#P').querySelectorAll('.stone').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(S.stones.includes(k))S.stones=S.stones.filter(x=>x!==k);else{if(S.stones.length>=2)S.stones.shift();S.stones.push(k)}$('#P').querySelectorAll('.stone').forEach(x=>x.classList.toggle('on',S.stones.includes(+x.dataset.k)));$('#nx').disabled=S.stones.length<2});onNext(()=>done(4,8))}},

{p:5,r(){app.innerHTML=card(`${head(5,'나를 대하는 태도')}<h2>내일 비 소식이 있어요.<br>당신은?</h2><div class="wx" id="W">${WX.map((t,i)=>`<button data-i="${i}">${wxIcon[i]}${t}</button>`).join('')}</div><div class="spacer"></div>${btn('골랐어요',true)}`);
$('#W').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.wx=+b.dataset.i;$('#W').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#nx').disabled=false});onNext(()=>done(5,9))}},

{p:6,r(){app.innerHTML=card(`<div class="spacer"></div><h2 style="text-align:center;margin:0 0 6px">처방전 조제 중…</h2><p class="sub" style="text-align:center">오늘 남긴 기록을 모으고 있어요</p><div class="spacer"></div>`);later(()=>go(10),1800)}},

{p:6,r(){rx()}}
];

const NAMES={see:'레이더 풀가동형',blame:'밤마다 이불킥형',perf:'만점 아니면 0점형',read:'셜록 홈즈형',strict:'나한테만 엄격형',fine:'잘 걷는 지네형'};
const STAMPT={see:'가면도<br>괜찮아',blame:'다들<br>잊었어',perf:'이만하면<br>충분해',read:'그냥<br>바빴대',strict:'나한테도<br>친절히',fine:'지금<br>처럼만'};
const RXS={
see:['혼자 있는 시간에는 가면을 벗고 숨 한번 고르기.','모든 모습을 다 보여주지 않아도 된다고 하루 한 번 되뇌기.'],
blame:['자기 전, 이불 차기 전에 버터플라이 허그 10초.','민망한 장면이 떠오르면 "다들 잊었어"라고 소리 내어 말하기.'],
perf:['제출 버튼 누르기 직전, "되면 좋고 아니면 말고" 한 번.','오늘 빠진 10점 말고 채운 90점부터 보기.'],
read:['짧은 답장이 오면 빈칸을 "그냥 바빴나 보다"로 채우기.','마음이 덜컥할 때 "아, 내 버튼이 눌렸구나" 하고 이름 붙이기.'],
strict:['실수한 날엔 친구에게 하듯 나에게 말 걸기.','한 번의 실패가 나라는 사람 전체를 정하지 않는다는 걸 기억하기.'],
fine:['힘든 날엔 "왜"보다 "오늘 저녁은 어떻게 보낼까"를 묻기.','걸음걸이를 너무 따지지 말고, 지금처럼 걷기.']};

function rx(){
const see=clamp(Math.round(S.lockSec*10+S.lockChg*20),0,100);
const blame=clamp(Math.round(S.kicks/60*100),0,100);
const redS=clamp(S.redraw*25,0,100),strictness=(S.fGiven-S.sGiven)-(S.fReal-S.sReal),strictS=clamp(50+strictness,0,100);
const perf=Math.round(redS*.6+strictS*.4);
const angry=S.judge.filter(k=>k===2).length;
const read=Math.round(S.judge.reduce((a,k)=>a+(k===null?1:k),0)/10*100);
const kind=clamp(Math.round([55,85,35,80][S.wx]-Math.max(0,strictness)/2),0,100);
const burden={see,blame,perf,read,strict:100-kind};
let top='fine',mx=49;for(const k in burden)if(burden[k]>mx){mx=burden[k];top=k}
const heavy=STONES[S.stones[S.stones.length-1]][0];
const EMP={
see:[S.lockSec>=3&&`잠글 것 하나 고르는 데 ${S.lockSec}초를 고민한 당신. 보여줄지 말지 고민하는 건 그만큼 나를 소중히 다룬다는 뜻이에요.`,S.lockChg&&`잠글 것을 고르다 마음을 ${S.lockChg}번 바꿨죠. 그 망설임마저 나를 지키려는 마음이에요.`,`${LOCKO[S.lock]} 잠가 둔 당신. 다 보여주지 않아도 당신은 충분히 진짜예요.`],
blame:[`10초 동안 이불을 ${S.kicks}번 찬 당신. 그 장면, 상대는 이미 기억도 못 할 거예요.`,`이불을 ${S.kicks}번이나 찼네요. 그만큼 잘하고 싶었던 거예요.`],
perf:[S.redraw&&`원을 ${S.redraw}번 다시 그린 당신. 그 전의 원도 충분히 동그랬어요.`,`친구 원엔 ${S.fGiven}점, 내 원엔 ${S.sGiven}점. 친구에게 준 만큼만 나에게도 줘 보세요.`],
read:[S.judge[0]===2&&`'네.' 한마디에 마음이 덜컥했죠? 보낸 사람은 그냥 바빴을 거예요.`,`짧은 답장 다섯 개 중 ${angry}개를 화난 걸로 읽은 당신. 대부분의 마침표는 그냥 마침표예요.`],
strict:[`친구 원엔 ${S.fGiven}점, 내 원엔 ${S.sGiven}점을 준 당신. 실제로는 ${S.sReal>=S.fReal?'내 원이 더 동그랬어요':'둘이 거의 비슷했어요'}.`,'남에게 건네던 "괜찮아"를 오늘은 나에게 먼저 건네 볼래요?'],
fine:[`"${heavy}"라는 돌을 들고도 여기까지 잘 걸어온 당신. 오늘은 조금 내려놓아도 괜찮아요.`,'지금 꽤 괜찮게 걷고 있어요. 그걸 알아차리는 것만으로도 충분해요.']};
const emp=pick(EMP[top].filter(Boolean)),cure=pick(RXS[top]);
const vals=[see,blame,perf,read,kind],labs=['시선','자책','완벽주의','해석','너그러움'];
const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[(150+r*Math.cos(a)).toFixed(1),(118+r*Math.sin(a)).toFixed(1)]};
const poly=r=>[0,1,2,3,4].map(i=>pt(i,r).join(',')).join(' ');
const radar=`<svg viewBox="0 0 300 240" style="width:100%;max-width:280px;display:block;margin:0 auto" role="img" aria-label="다섯 축 점수: ${labs.map((l,i)=>l+' '+vals[i]).join(', ')}"><polygon points="${poly(80)}" fill="none" stroke="var(--line)" stroke-width="1.5"/><polygon points="${poly(40)}" fill="none" stroke="var(--line)"/>${[0,1,2,3,4].map(i=>`<line x1="150" y1="118" x2="${pt(i,80)[0]}" y2="${pt(i,80)[1]}" stroke="var(--line)"/>`).join('')}<polygon points="${vals.map((v,i)=>pt(i,Math.max(6,v*.8)).join(',')).join(' ')}" fill="var(--acc)" fill-opacity=".18" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${labs.map((l,i)=>{const p=pt(i,102);return `<text x="${p[0]}" y="${+p[1]+5}" text-anchor="middle" font-size="13" fill="var(--mute)">${l}</text>`}).join('')}</svg>`;
const d=new Date();
app.innerHTML=card(`<div class="head"><span>처방전 · ${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}</span><span>${S.nick}</span></div><p class="sub" style="margin:0">진단명</p><h1 style="font-size:28px;margin:2px 0 6px;padding-right:96px">${NAMES[top]}</h1><div class="stamp pop">${STAMPT[top]}</div>${radar}<p class="emp">${emp}</p><div class="drug"><b>처방</b>${cure}</div>`,'rx')+`<button class="ghost" id="again" style="width:100%;margin-top:14px;background:var(--paper)">처음부터 다시</button>`;
$('#again').onclick=()=>{reset();go(0)}}

function dots(p){$('#dots').innerHTML=[1,2,3,4,5].map(i=>`<i class="${i<=p?'on':''}"></i>`).join('')}
function go(n){clearT();window.scrollTo(0,0);dots(steps[n].p);steps[n].r()}

let hc=0,toasted=false;
$('#heart').onclick=()=>{hc++;$('#hc').textContent=hc;const fx=$('#fx');for(let k=0;k<3;k++){const h=document.createElement('div');h.className='fh';h.style.left=(50+(Math.random()-.5)*16)+'%';h.style.setProperty('--dx',((Math.random()-.5)*120)+'px');h.style.animationDelay=(k*.12)+'s';h.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.5 6.6 4.5c2.1 0 3.4 1.2 4.4 2.6 1-1.4 2.3-2.6 4.4-2.6 3.6 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z" fill="currentColor"/></svg>';fx.appendChild(h);setTimeout(()=>h.remove(),2000)}
if(!toasted){toasted=true;const t=document.createElement('div');t.className='toast';t.textContent='실제 발표에선 이 하트가 발표 화면에 떠올라요';document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),500)},2400)}};

go(0);
}
</script>
